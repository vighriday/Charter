<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Charter">
  <!--
    The mark is a signature line with nothing written on it.

    Everything above the line is the packet Charter prepares, set as the record
    it keeps: three short rules in ink, getting shorter, the way a run reads.
    The line itself is where a person signs, and it is empty because the
    software cannot put anything there. That is the whole product in one mark,
    and it is the only drawing on this site.
  -->
  <rect width="32" height="32" fill="#E8EBE4" />
  <g fill="#171815">
    <rect x="7" y="9" width="18" height="1.4" />
    <rect x="7" y="13" width="14" height="1.4" />
    <rect x="7" y="17" width="9" height="1.4" />
  </g>
  <rect x="7" y="24" width="18" height="1.4" fill="#1E3766" />
</svg>
